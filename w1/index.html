<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片</title>
  <!-- 引入 CSS 樣式檔案 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-container">
    <!-- 1. 圓形大頭貼照片（可替換 src 裡面的圖片連結） -->
    <img src="https://i.postimg.cc/WpmBgqBS/avatar-em-be-ma-phinh.jpg" class="profile-img">

    <!-- 2. 姓名與簡短自我介紹 -->
    <h1 class="profile-name">李瓊英</h1>
    <p class="profile-bio">✨ 熱愛生活的 UI/UX 設計新手｜記錄設計與日常的美好小事</p>

    <!-- 3. 按鈕連結 -->
    <div class="button-group">
      <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">Instagram</a>
      <a href="mailto:your-email@example.com" class="btn btn-email">Email 聯絡我</a>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Cyber-Exhibition | 朋友對我的動態留言牆</title>

  <!-- 載入 Google 字體 (Orbitron 科技感數字標題 + Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 【顏色與風格變數設定】(資深工程師提示：您可以在這裡輕鬆更換主題配色)
       ========================================================================== */
    :root {
      /* 【主題顏色】賽博霓虹配色 */
      --neon-cyan: #00f3ff;          /* 主色：極光青藍 (高亮邊框與發光核心) */
      --neon-magenta: #ff007f;       /* 副色：霓虹粉紅 (裝飾線條與亮點) */
      --neon-yellow: #ffe600;        /* 點綴色：賽博金黃 */
      
      /* 【背景與卡片底色】深色玻璃擬態 (Glassmorphism) */
      --bg-dark: #080a10;            /* 全局深色夜空背景 */
      --card-bg: rgba(18, 24, 38, 0.65); /* 留言卡片背景 (半透明) */
      --card-border: rgba(0, 243, 255, 0.18); /* 卡片預設邊框 */
      
      /* 【文字顏色】 */
      --text-main: #f0f6fc;          /* 主要文字 (高對比冷白) */
      --text-muted: #8b9bb4;         /* 次要文字 (灰藍) */

      /* 【輪播高亮效果控制區】可在這裡微調高亮時的光彩與縮放感 */
      --highlight-glow: rgba(0, 243, 255, 0.65); /* 發光陰影顏色 */
      --dimmed-opacity: 0.32;       /* 未選中卡片的透明度 (0.1 ~ 1.0) */
      --dimmed-blur: 2.5px;          /* 未選中卡片的模糊程度 (px) */

      /* 【佈局與圓角】 */
      --card-radius: 16px;
      --font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-code: 'Orbitron', monospace;
    }

    /* 全局重置與網頁背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      /* 動態科技感動態幾何背景微光 */
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(255, 0, 127, 0.07) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      padding: 2.5rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* 頁頭 Header 區塊 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .badge-tag {
      display: inline-block;
      font-family: var(--font-code);
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    /* 主內容容器 */
    .app-container {
      width: 100%;
      max-width: 1140px;
    }

    /* 展覽動態控制儀表板 (顯示目前播放索引與總數) */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 0.6rem 1.5rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      backdrop-filter: blur(10px);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      animation: pulseDot 1.5s infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.4; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* ==========================================================================
       2. 【酷炫載入動畫 (Loading Animation)】
       ========================================================================== */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 0;
      width: 100%;
    }

    /* 賽博雙層旋轉環 */
    .cyber-spinner {
      position: relative;
      width: 65px;
      height: 65px;
    }

    .cyber-spinner::before,
    .cyber-spinner::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }

    .cyber-spinner::before {
      inset: 0;
      border: 3px solid transparent;
      border-top-color: var(--neon-cyan);
      border-right-color: var(--neon-cyan);
      animation: spinClockwise 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      filter: drop-shadow(0 0 8px var(--neon-cyan));
    }

    .cyber-spinner::after {
      inset: 8px;
      border: 3px solid transparent;
      border-bottom-color: var(--neon-magenta);
      border-left-color: var(--neon-magenta);
      animation: spinCounter 0.9s linear infinite;
      filter: drop-shadow(0 0 8px var(--neon-magenta));
    }

    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* 酷炫載入文字 */
    .loading-text {
      margin-top: 1.8rem;
      font-family: var(--font-code);
      font-size: 1.05rem;
      letter-spacing: 3px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
      animation: textFlicker 1.8s infinite alternate;
    }

    @keyframes textFlicker {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ==========================================================================
       3. 【瀑布流排版 (Masonry Layout)】採用 CSS column-count 實現錯落排列
       ========================================================================== */
    .masonry-wall {
      column-count: 3;        /* 桌機預設：3 欄高低錯落排列 */
      column-gap: 1.5rem;     /* 欄位間距 */
      display: none;          /* 資料讀取完成後再開啟顯示 */
      width: 100%;
    }

    /* 響應式斷點 (Responsive Columns) */
    @media (max-width: 960px) {
      .masonry-wall { column-count: 2; } /* 平板：2 欄 */
    }

    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; } /* 手機：1 欄 */
      header h1 { font-size: 1.7rem; }
    }

    /* ==========================================================================
       4. 【留言卡片樣式 & 隨時間輪播特效 (Highlight & Dimmed)】
       ========================================================================== */
    .card {
      break-inside: avoid;    /* 防切割：確保卡片不會被瀑布流欄位截斷 */
      margin-bottom: 1.5rem;  /* 卡片下方留白 */
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 1.4rem;
      position: relative;
      overflow: hidden;

      /* 【重點動畫 Transition】卡片狀態切換時的平滑轉場 */
      transition: 
        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.6s ease,
        filter 0.6s ease,
        border-color 0.6s ease,
        box-shadow 0.6s ease;
      transform-origin: center center;
    }

    /* 卡片角落裝飾線 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 35px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), transparent);
    }

    /* -----------------------------------------------------------------
       【狀態 1：未選中卡片 (Dimmed State)】
       自動變暗、變模糊、稍微縮小，凸顯焦點
       ----------------------------------------------------------------- */
    .card.is-dimmed {
      opacity: var(--dimmed-opacity);
      filter: blur(var(--dimmed-blur)) grayscale(20%);
      transform: scale(0.96);
    }

    /* -----------------------------------------------------------------
       【狀態 2：高亮焦點卡片 (Highlight State - 輪播主角)】
       放大、顯眼發光邊框、清晰顯示、頂層顯示
       ----------------------------------------------------------------- */
    .card.is-highlight {
      opacity: 1;
      filter: blur(0px) grayscale(0%);
      transform: scale(1.05) translateY(-4px); /* 放大並微微浮起 */
      z-index: 20;                             /* 提升至最上層 */
      border-color: var(--neon-cyan);
      box-shadow: 
        0 0 25px var(--highlight-glow),
        inset 0 0 15px rgba(0, 243, 255, 0.15);
    }

    /* 高亮時右上角出現的動態展覽焦點標籤 */
    .card.is-highlight::after {
      content: '⚡ EXHIBIT ACTIVE';
      position: absolute;
      top: 12px;
      right: 12px;
      font-family: var(--font-code);
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: #000;
      background: var(--neon-cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 800;
      box-shadow: 0 0 10px var(--neon-cyan);
      animation: badgePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes badgePop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* 卡片頭部：名字與時間/編號 */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .card-author {
      font-weight: 700;
      font-size: 1.05rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* 作者名字旁的小頭像圖案 */
    .author-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0,243,255,0.3), rgba(255,0,127,0.3));
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .card-time {
      font-family: var(--font-code);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* 卡片主要留言內容 */
    .card-content {
      font-size: 0.96rem;
      line-height: 1.65;
      color: #e2e8f0;
      word-break: break-word;
      white-space: pre-wrap; /* 完整保留使用者輸入的換行 */
    }

    /* 無留言資料時顯示 */
    #empty-state {
      display: none;
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--card-radius);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge-tag">CYBER EXHIBITION WALL</div>
    <h1>✨ 朋友對我的動態留言牆 ✨</h1>
    <p>Live Interactive Message Wall with Auto-Carousel Highlight</p>
  </header>

  <main class="app-container">
    <!-- 1. 展覽動態狀態列 (顯示目前輪播卡片狀態) -->
    <div class="status-bar">
      <div class="status-item">
        <div class="status-dot"></div>
        <span>即時展覽輪播中</span>
      </div>
      <div class="status-item" style="font-family: var(--font-code);">
        FOCUS: <span id="current-index-display" style="color: var(--neon-cyan); font-weight:700;">#00</span> / <span id="total-count-display">00</span>
      </div>
    </div>

    <!-- 2. 酷炫載入中動畫區塊 -->
    <div id="loading-screen">
      <div class="cyber-spinner"></div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 3. 瀑布流留言卡片牆 -->
    <div id="masonry-wall" class="masonry-wall"></div>

    <!-- 4. 無資料提示區 -->
    <div id="empty-state">
      目前試算表中還沒有留言資料喔！
    </div>
  </main>

  <script>
    // ==========================================================================
    // JS 控制設定區 (資深工程師提示：您可以在這裡輕鬆設定 CSV 網址與輪播秒數)
    // ==========================================================================

    // Google 試算表 CSV 發布網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpxuyx-gVUYf4f3d8QN1rb1FWCRoIUY0lkl1hCPSSm6l8_IecsLVjUUiVZ2iYDcgXYZ2jZvp_A2Eh5/pub?output=csv';

    // 【重點修改處】輪播切換時間 (單位：毫秒，3000ms = 3 秒鐘)
    const CAROUSEL_INTERVAL_MS = 3000;

    // 全局變數
    let messages = [];        // 解析後的留言物件陣列
    let currentIndex = 0;     // 當前高亮卡片索引
    let carouselTimer = null; // 輪播計時器

    // ==========================================================================
    // 1. 完整且嚴謹的 CSV 解析器 (正確處理由雙引號包覆、包含逗號或換行的留言)
    // ==========================================================================
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          // 處理 CSV 雙引號轉義 (例如 "")
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++; // 跳過下一個轉義引號
          } else {
            insideQuotes = !insideQuotes; // 切換引號包覆狀態
          }
        } else if (char === ',' && !insideQuotes) {
          // 在雙引號外的逗號，代表切換下一個欄位
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          // 在雙引號外的換行，代表切換下一列
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 Windows 換行符 \r\n
          }
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      // 處理最後一列資料
      if (currentCell !== '' || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        if (currentRow.some(cell => cell !== '')) {
          rows.push(currentRow);
        }
      }

      if (rows.length === 0) return [];

      // 判斷並移除第一列標題列 (時間戳記, 名字, 說悄悄話)
      if (rows[0][0] && (rows[0][0].includes('時間') || rows[0][1]?.includes('名字'))) {
        rows.shift();
      }

      // 格式化轉換為資料物件
      return rows.map(r => ({
        timestamp: r[0] ? r[0] : '',
        name: r[1] && r[1].trim() !== '' ? r[1].trim() : '秘密朋友',
        // CSV 欄位: [0]=時間戳記, [1]=名字, [2]=說悄悄話/留言內容
        message: r[2] && r[2].trim() !== '' ? r[2].trim() : (r[1] ? r[1].trim() : '（這是一位朋友留下的悄悄話）')
      }));
    }

    // ==========================================================================
    // 2. 使用 fetch API 讀取 Google 試算表 CSV
    // ==========================================================================
    async function loadMessageData() {
      const loadingScreen = document.getElementById('loading-screen');
      const masonryWall = document.getElementById('masonry-wall');
      const emptyState = document.getElementById('empty-state');
      const totalCountDisplay = document.getElementById('total-count-display');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);

        const csvRawText = await response.text();
        messages = parseCSV(csvRawText);

        // 隱藏讀取動畫
        loadingScreen.style.display = 'none';

        if (messages.length === 0) {
          emptyState.style.display = 'block';
          return;
        }

        // 更新總卡片數
        totalCountDisplay.textContent = String(messages.length).padStart(2, '0');

        // 動態生成 DOM 卡片牆
        renderMasonryCards(messages);
        masonryWall.style.display = 'block';

        // 啟動 3 秒輪播焦點特效
        startCarousel();

      } catch (error) {
        console.error('讀取 CSV 留言資料失敗:', error);
        loadingScreen.querySelector('.loading-text').textContent = '資料載入失敗，請確認網路或試算表網址！';
      }
    }

    // ==========================================================================
    // 3. 動態渲染留言卡片至瀑布流牆 (Masonry Wall)
    // ==========================================================================
    function renderMasonryCards(dataList) {
      const wallContainer = document.getElementById('masonry-wall');
      wallContainer.innerHTML = '';

      dataList.forEach((item, idx) => {
        const card = document.createElement('div');
        // 預設加上 is-dimmed (暗化狀態)，由輪播控制器賦予 is-highlight
        card.className = 'card is-dimmed';
        card.dataset.index = idx;

        // 整理時間顯示 (例如：僅保留日期)
        const dateString = item.timestamp ? item.timestamp.split(' ')[0] : 'JUST NOW';

        card.innerHTML = `
          <div class="card-header">
            <div class="card-author">
              <div class="author-avatar">💬</div>
              <span>${escapeHTML(item.name)}</span>
            </div>
            <span class="card-time">${escapeHTML(date
